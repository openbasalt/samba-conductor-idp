# nfpm configuration of the "conductor-idp" package, one file for the .deb
# and the .rpm. Built by packaging/build.sh, which sets ARCH, PKG_VERSION,
# PKG_REVISION, BUILD (staging directory) and SOURCE_DATE_EPOCH (every
# timestamp). Paths are relative to the repository root. Entries marked
# "packager: deb" or "packager: rpm" exist in one format only (Debian keeps
# docs and licenses in /usr/share/doc and sets modes in postinst; Fedora
# keeps licenses in /usr/share/licenses and owns its directories in the
# payload).
name: conductor-idp
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: ${PKG_REVISION}
section: admin
priority: optional
maintainer: Samba Conductor maintainers <samba-conductor@openbasalt.org>
vendor: OpenBasalt
homepage: https://github.com/openbasalt/samba-conductor-idp
license: Apache-2.0
description: |-
  OpenID Connect and SAML 2.0 identity provider backed by Samba AD
  conductor-idp signs users in with their Active Directory account (Kerberos
  or LDAPS to the domain controllers) and serves OpenID Connect (Authorization
  Code with PKCE, discovery, JWKS with key rotation, refresh token rotation)
  and SAML 2.0 to registered applications, with access per AD group and the
  Samba Conductor second-factor policy. It is part of Samba Conductor and can
  run on a domain controller or on any host with LDAPS access to one.
  .
  Nothing is started at installation: configure it first (see the README
  in /usr/share/doc/conductor-idp).

depends:
  - systemd | systemd-standalone-sysusers | systemd-sysusers
suggests:
  - conductor

rpm:
  summary: OpenID Connect and SAML 2.0 identity provider backed by Samba AD
  group: Applications/System
  buildhost: build.samba-conductor.openbasalt.org
  compression: zstd

overrides:
  deb:
    scripts:
      postinstall: packaging/scripts/postinst
      preremove: packaging/scripts/prerm
      postremove: packaging/scripts/postrm
  rpm:
    depends:
      - systemd
      # The SELinux policy wherever the targeted policy is installed
      # (Fedora, Basalt OS): installed first, so the files get their labels;
      # the same version, so an upgrade of the package upgrades its policy.
      - (conductor-idp-selinux = ${PKG_VERSION}-${PKG_REVISION} if selinux-policy-targeted)
    suggests:
      - conductor
    scripts:
      preinstall: packaging/rpm/pre
      postinstall: packaging/rpm/post
      preremove: packaging/rpm/preun
      postremove: packaging/rpm/postun

contents:
  - expand: true
    src: ${BUILD}/bin/conductor-idp
    dst: /usr/bin/conductor-idp
    file_info: {mode: 0755}
  - expand: true
    src: ${BUILD}/systemd/conductor-idp.service
    dst: /usr/lib/systemd/system/conductor-idp.service
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/systemd/conductor-idp-api.socket
    dst: /usr/lib/systemd/system/conductor-idp-api.socket
    file_info: {mode: 0644}
  - src: packaging/sysusers.conf
    dst: /usr/lib/sysusers.d/conductor-idp.conf
    file_info: {mode: 0644}
  # Configuration. Debian: modes from postinst (dpkg-statoverride).
  - src: idp.toml.example
    dst: /etc/conductor-idp/idp.toml
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  # Fedora: the package owns its directories with their final modes.
  - dst: /etc/conductor-idp
    type: dir
    packager: rpm
    file_info: {mode: 0750, owner: root, group: conductor-idp}
  - src: idp.toml.example
    dst: /etc/conductor-idp/idp.toml
    type: config|noreplace
    packager: rpm
    file_info: {mode: 0640, owner: root, group: conductor-idp}
  - dst: /etc/conductor-idp/tls
    type: dir
    packager: rpm
    file_info: {mode: 0750, owner: root, group: conductor-idp}
  - dst: /etc/conductor-idp/credentials
    type: dir
    packager: rpm
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /var/lib/conductor-idp
    type: dir
    packager: rpm
    file_info: {mode: 0700, owner: conductor-idp, group: conductor-idp}
  # A plain file in the .deb, a documentation file (%doc) in the .rpm.
  - expand: true
    src: ${BUILD}/man/conductor-idp.8.gz
    dst: /usr/share/man/man8/conductor-idp.8.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/man/conductor-idp.8.gz
    dst: /usr/share/man/man8/conductor-idp.8.gz
    type: doc
    packager: rpm
    file_info: {mode: 0644}
  # Debian documentation and licenses.
  - src: packaging/copyright
    dst: /usr/share/doc/conductor-idp/copyright
    packager: deb
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/doc/conductor-idp/NOTICE
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-idp/THIRD-PARTY-LICENSES.gz
    dst: /usr/share/doc/conductor-idp/THIRD-PARTY-LICENSES.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-idp/changelog.Debian.gz
    dst: /usr/share/doc/conductor-idp/changelog.Debian.gz
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/README.Debian
    dst: /usr/share/doc/conductor-idp/README.Debian
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/conductor-idp
    packager: deb
    file_info: {mode: 0644}

  # Fedora documentation and licenses (%license, %doc), in directories the
  # package owns (removed with it).
  - dst: /usr/share/doc/conductor-idp
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - dst: /usr/share/licenses/conductor-idp
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - src: LICENSE
    dst: /usr/share/licenses/conductor-idp/LICENSE
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/licenses/conductor-idp/NOTICE
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-idp/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/conductor-idp/THIRD-PARTY-LICENSES
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - src: packaging/rpm/README.Fedora
    dst: /usr/share/doc/conductor-idp/README.Fedora
    type: doc
    packager: rpm
    file_info: {mode: 0644}
