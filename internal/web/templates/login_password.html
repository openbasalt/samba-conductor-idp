{{define "title"}}{{t "password.title"}}{{end}}
{{define "content"}}<div class="card narrow">
  <h1>{{t "password.title"}}</h1>
  <p data-e2e="password-text-intro">{{t "password.intro" .D.Username}}</p>
  {{template "error-alert" .D.Error}}
  <form method="post" action="/login/password" autocomplete="off">
    {{template "csrf" .}}{{template "cont" .}}
    <div class="field">
      <label for="current">{{t "password.current"}}</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required data-e2e="password-input-current">
    </div>
    <div class="field">
      <label for="new">{{t "password.new"}}</label>
      <input id="new" name="new" type="password" autocomplete="new-password" required data-e2e="password-input-new">
    </div>
    <div class="field">
      <label for="confirm">{{t "password.confirm"}}</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required data-e2e="password-input-confirm">
    </div>
    <button class="btn btn-primary btn-block" type="submit" data-e2e="password-btn-submit">{{t "password.submit"}}</button>
  </form>
  <form method="post" action="/logout" class="actions">{{template "csrf" .}}<button class="btn btn-block" type="submit" data-e2e="password-btn-cancel">{{t "form.cancel"}}</button></form>
</div>{{end}}
